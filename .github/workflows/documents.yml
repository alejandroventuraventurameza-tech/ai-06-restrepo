name: Repository 6 documents
on:
  pull_request:
    paths:
      - 'presentation.tex'
      - 'derivation/*.tex'
      - 'extra/tutorial/*.tex'
      - 'hand/**'
      - 'sim/results/**'
      - '.github/workflows/documents.yml'
      - 'extra/audit/render_documents.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install TeX and render dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends latexmk texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended texlive-pictures texlive-lang-spanish lmodern poppler-utils python3-pil
      - name: Compile and check final logs
        run: |
          set -euo pipefail
          latexmk -pdf -interaction=nonstopmode -halt-on-error -file-line-error presentation.tex
          (cd derivation && latexmk -pdf -interaction=nonstopmode -halt-on-error -file-line-error derivation.tex)
          (cd extra/tutorial && latexmk -pdf -interaction=nonstopmode -halt-on-error -file-line-error tutorial.tex)
          python3 extra/audit/render_documents.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compiled-documents
          path: |
            presentation.pdf
            presentation.log
            derivation/derivation.pdf
            derivation/derivation.log
            extra/tutorial/tutorial.pdf
            extra/tutorial/tutorial.log
            extra/audit/qa-render/
      - name: Publish PDF review candidate to a separate work branch
        if: github.event_name == 'pull_request' && github.head_ref == 'work/repository-6-closeout-20261126'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add presentation.pdf derivation/derivation.pdf extra/tutorial/tutorial.pdf extra/audit/qa-render
          if git diff --cached --quiet; then echo "PDFs already integrated"; exit 0; fi
          git commit -m "build: compile and render repository 6 documents"
          git push origin "HEAD:refs/heads/work/repository6-pdf-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
